<!DOCTYPE html>
<html lang="en">
<head>

        body { font-family: sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
        h1 { font-size: 18px; margin-bottom: 8px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        iframe { display: block; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,0.15); }

    <p>Requires <code>npx serve public</code> running on port 3000.</p>

        width="860"
        height="500"
        frameborder="0"
    ></iframe>

</html>
